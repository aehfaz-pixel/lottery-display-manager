<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnostics</title>
<script src="diagnostics.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#21262d;
  --border:#30363d;--text:#e6edf3;--muted:#9da7b3;
  --accent:#f5c500;--primary:#1f6feb;--green:#3fb950;--warn:#d29922;--red:#f85149;
}
html[data-theme="light"]{
  --bg:#f6f8fa;--surface:#ffffff;--surface2:#eef1f4;
  --border:#d0d7de;--text:#1f2328;--muted:#57606a;
  --accent:#9a6700;--primary:#0969da;--green:#1a7f37;--warn:#9a6700;--red:#cf222e;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text)}
#shell{display:flex;flex-direction:column;height:100vh}
#bar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);flex-shrink:0;
}
#bar .title{font-weight:800;font-size:13px;color:var(--accent);margin-right:8px}
.filter-btn{
  appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--muted);
  font-size:11px;font-weight:700;padding:5px 10px;border-radius:14px;cursor:pointer;
}
.filter-btn.active{color:#fff;border-color:transparent}
.filter-btn[data-cat="scan"].active{background:var(--primary)}
.filter-btn[data-cat="route"].active{background:#8957e5}
.filter-btn[data-cat="state"].active{background:var(--green)}
.filter-btn[data-cat="ipc"].active{background:#39a5c4}
.filter-btn[data-cat="error"].active{background:var(--red)}
.filter-btn[data-cat="info"].active,.filter-btn[data-cat="action"].active{background:var(--muted)}
.filter-btn[data-cat="all"].active{background:var(--accent);color:#2b1d00}
#spacer{flex:1}
#count{font-size:11px;color:var(--muted)}
button.tool{
  appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);
  font-size:11px;font-weight:700;padding:6px 12px;border-radius:6px;cursor:pointer;
}
button.tool:hover{border-color:var(--accent)}
button.tool.on{background:var(--accent);color:#2b1d00;border-color:transparent}
#list{flex:1;overflow-y:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
.entry{
  display:flex;gap:10px;padding:6px 14px;border-bottom:1px solid var(--border);align-items:flex-start;
}
.entry:hover{background:var(--surface)}
.entry .time{color:var(--muted);white-space:nowrap;flex-shrink:0;width:78px}
.entry .tab{
  flex-shrink:0;width:64px;color:var(--muted);text-transform:uppercase;font-size:10px;font-weight:700;padding-top:1px;
}
.badge{
  flex-shrink:0;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:800;text-transform:uppercase;
  height:fit-content;
}
.badge.scan{background:var(--primary);color:#fff}
.badge.route{background:#8957e5;color:#fff}
.badge.state{background:var(--green);color:#04210c}
.badge.ipc{background:#39a5c4;color:#04210c}
.badge.layout{background:#db6d28;color:#fff}
.badge.error{background:var(--red);color:#fff}
.badge.info,.badge.action{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.entry .msg{flex:1;word-break:break-word;white-space:pre-wrap}
.entry .id{color:var(--muted);opacity:.6;flex-shrink:0;font-size:10px;padding-top:2px}
.diff-row{display:flex;gap:6px;font-size:10.5px;color:var(--muted)}
.diff-row .path{color:var(--accent);flex-shrink:0}
.diff-row .arrow{opacity:.6}
#empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div id="shell">
  <div id="bar" data-diag-ui>
    <span class="title">🩺 DIAGNOSTICS</span>
    <button class="filter-btn active" data-cat="all">All</button>
    <button class="filter-btn" data-cat="scan">Scan</button>
    <button class="filter-btn" data-cat="route">Route</button>
    <button class="filter-btn" data-cat="state">State</button>
    <button class="filter-btn" data-cat="ipc">IPC</button>
    <button class="filter-btn" data-cat="layout">Layout</button>
    <button class="filter-btn" data-cat="error">Error</button>
    <button class="filter-btn" data-cat="info">Info</button>
    <div id="spacer"></div>
    <span id="count">0 events</span>
    <button class="tool" id="inspectBtn" onclick="toggleInspectBtn()">🔍 Inspect: OFF</button>
    <button class="tool" onclick="copyVisible()">Copy JSON</button>
    <button class="tool" onclick="clearLog()">Clear</button>
  </div>
  <div id="list"><div id="empty">No diagnostic events yet — scan something or use the app.</div></div>
</div>

<script>
let activeCat='all';
let lastRendered=[];

function fmtTime(ts){
  const d=new Date(ts);
  const pad=n=>String(n).padStart(2,'0');
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3,'0')}`;
}

function render(){
  const all=Diag.readLog();
  const filtered = activeCat==='all' ? all : all.filter(e=>e.cat===activeCat);
  lastRendered = filtered;
  document.getElementById('count').textContent = `${filtered.length} of ${all.length} events`;
  const list=document.getElementById('list');
  if(!filtered.length){
    list.innerHTML='<div id="empty">No diagnostic events yet — scan something or use the app.</div>';
    return;
  }
  const wasNearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 40;
  list.innerHTML = filtered.slice().reverse().map(e=>{
    let extra='';
    if(e.diff && e.diff.length){
      extra = '<div style="margin-top:3px">' + e.diff.map(c=>`
        <div class="diff-row"><span class="path">${escapeHtml(c.path)}</span><span class="arrow">:</span> ${escapeHtml(c.before)} <span class="arrow">→</span> ${escapeHtml(c.after)}</div>
      `).join('') + '</div>';
    } else if(e.data){
      extra = '<br><span style="color:var(--muted);opacity:.8">'+escapeHtml(typeof e.data==='string'?e.data:JSON.stringify(e.data))+'</span>';
    }
    return `
    <div class="entry">
      <span class="time">${fmtTime(e.t)}</span>
      <span class="tab">${e.tab||''}</span>
      <span class="badge ${e.cat}">${e.cat}</span>
      <span class="msg">${escapeHtml(e.msg)}${e.count>1?' <span style="color:var(--accent);font-weight:800">×'+e.count+'</span>':''}${extra}</span>
      <span class="id">${e.id!=='none'?e.id:''}</span>
    </div>
  `;}).join('');
  if(wasNearBottom) list.scrollTop=0; // newest is at top since we reverse()
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeCat=btn.dataset.cat;
    render();
  });
});

function clearLog(){
  if(!confirm('Clear the diagnostic log? This cannot be undone.')) return;
  Diag.clear();
  render();
}

function copyVisible(){
  const text=JSON.stringify(lastRendered,null,2);
  const btn=document.querySelector('button.tool[onclick="copyVisible()"]') || event.target;
  const orig=btn.textContent;
  function ok(){ btn.textContent='Copied!'; setTimeout(()=>btn.textContent=orig,1200); }
  function fallbackCopy(reason){
    if(window.Diag) Diag.log('none','error','Copy JSON via Clipboard API failed ('+reason+'), trying fallback');
    try{
      const ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; ta.style.top='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const success=document.execCommand('copy');
      document.body.removeChild(ta);
      if(success){ ok(); }
      else {
        if(window.Diag) Diag.log('none','error','Copy JSON fallback (execCommand) also failed');
        btn.textContent='Copy failed — see console'; setTimeout(()=>btn.textContent=orig,1800);
      }
    }catch(e2){
      if(window.Diag) Diag.log('none','error','Copy JSON fallback threw: '+e2.message);
      btn.textContent='Copy failed — see console'; setTimeout(()=>btn.textContent=orig,1800);
    }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok).catch(e=>fallbackCopy(e&&e.message?e.message:String(e)));
  } else {
    fallbackCopy('Clipboard API unavailable');
  }
}

function toggleInspectBtn(){
  const on = localStorage.getItem('__diagInspectMode')==='1';
  if(window.Diag) Diag.setInspectMode(!on);
  updateInspectBtn();
}
function updateInspectBtn(){
  const on = localStorage.getItem('__diagInspectMode')==='1';
  const btn=document.getElementById('inspectBtn');
  btn.textContent = '🔍 Inspect: '+(on?'ON':'OFF');
  btn.classList.toggle('on', on);
}
window.addEventListener('storage', e=>{
  if(e.key==='__diagInspectMode') updateInspectBtn();
});
updateInspectBtn();

// Live updates: other iframes writing to localStorage fire 'storage' here.
window.addEventListener('storage', e=>{
  if(e.key==='__diagLog') render();
});
// Fallback poll, in case a same-document write doesn't fire 'storage' (it never does
// in the writing document itself) — catches errors thrown inside this page too.
setInterval(render, 1500);

function applyExternalTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
}
window.applyExternalTheme = applyExternalTheme;

render();
</script>
</body>
</html>
